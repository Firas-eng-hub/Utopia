# Free deployment. Render's free PostgreSQL database expires after 30 days.
services:
  - type: web
    name: utopiahire-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: utopiahire-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESUME_STORAGE
        value: database
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: RESUME_UPLOAD_DIR
        value: /var/data/resumes

databases:
  - name: utopiahire-db
    region: frankfurt
    plan: free
    databaseName: utopiahire
    user: utopiahire
    ipAllowList: []
